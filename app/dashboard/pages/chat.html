<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat - CenterOS</title>
  <meta name="description" content="Chat with an OpenRouter model from the CenterOS dashboard.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .chat-wrap { max-width: 760px; }
    .chat-log { display: grid; gap: 12px; margin-bottom: 18px; min-height: 200px; }
    .msg { padding: 14px 18px; border-radius: 12px; background: var(--white);
      border: 1px solid var(--line); box-shadow: var(--shadow); white-space: pre-wrap; }
    .msg.user { justify-self: end; max-width: 85%; background: var(--brand-soft); }
    .msg.assistant { justify-self: start; max-width: 95%; }
    .msg .who { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 800;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    .chat-input { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .chat-input textarea {
      padding: 12px 14px; font-size: 16px; font-family: inherit; resize: vertical; min-height: 56px;
      border: 1px solid var(--line); border-radius: 9px; background: var(--white); color: var(--ink);
    }
    .chat-input button {
      padding: 0 26px; font-size: 17px; font-weight: 750; color: var(--white);
      background: var(--brand); border: 0; border-radius: 9px; cursor: pointer;
    }
    .chat-input button:disabled { opacity: 0.6; cursor: wait; }
    .chat-hint { color: var(--muted); }
  </style>
</head>
<body class="dashboard-frame-page">
  <header class="topbar">
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="home.html">CenterOS</a>
      <span aria-hidden="true">/</span>
      <span>Chat</span>
    </nav>
    <div class="install-status" aria-label="Install status">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="chat-model">…</span>
    </div>
  </header>

  <section class="dashboard-page">
    <header class="dashboard-page-header">
      <p class="eyebrow">AI</p>
      <h1>Chat</h1>
      <p id="chat-hint">Ask anything. Runs on your configured OpenRouter model.</p>
    </header>

    <div class="chat-wrap">
      <div class="chat-log" id="chat-log"></div>
      <form class="chat-input" id="chat-form">
        <textarea id="chat-text" placeholder="Type a message…" required></textarea>
        <button type="submit" id="chat-send">Send</button>
      </form>
    </div>
  </section>

  <script>
    const logEl = document.getElementById("chat-log");
    const textEl = document.getElementById("chat-text");
    const sendEl = document.getElementById("chat-send");
    const history = [];

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function addMsg(who, text) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.innerHTML = "<span class=\"who\">" + who + "</span>" + esc(text);
      logEl.appendChild(div);
      div.scrollIntoView({ block: "nearest" });
      return div;
    }

    fetch("/api/settings").then((r) => r.json()).then((data) => {
      document.getElementById("chat-model").textContent = data.model || "no model";
      if (!data.openrouter_configured) {
        document.getElementById("chat-hint").innerHTML =
          "No API key set. Open <a href=\"settings.html\">Settings</a> first.";
      }
    }).catch(() => {});

    document.getElementById("chat-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const text = textEl.value.trim();
      if (!text) return;
      textEl.value = "";
      sendEl.disabled = true;
      addMsg("user", text);
      history.push({ role: "user", content: text });
      const pending = addMsg("assistant", "…");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history.slice(-20) })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          pending.innerHTML = "<span class=\"who\">assistant</span>" + esc(
            "Error (" + res.status + "): " + (data.error || "unknown") +
            (data.hint ? " " + data.hint : ""));
          return;
        }
        pending.innerHTML = "<span class=\"who\">assistant</span>" + esc(data.reply);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.innerHTML = "<span class=\"who\">assistant</span>" + esc("Request failed: " + err);
      } finally {
        sendEl.disabled = false;
        textEl.focus();
      }
    });
  </script>
</body>
</html>
